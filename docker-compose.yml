version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - /var/www/html/vendor
    depends_on:
      - mysql
      - redis
    env_file: .env
    environment:
      - PHP_IDE_CONFIG=serverName=docker
      - XDEBUG_CONFIG="client_host=host.docker.internal client_port=9003"

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /var/www/html/vendor
      - storage:/var/www/html/storage
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: memes_db
      MYSQL_USER: memes_user
      MYSQL_PASSWORD: memes_password

  redis:
    build:
      context: ./docker/redis
      dockerfile: Dockerfile
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  python-stemmer:
    build:
      context: ./docker/python
      dockerfile: python-stemmer.dockerfile
    volumes:
      - ./docker/python/.:/app
      - huggingface_cache:/huggingface_cache
    environment:
      - REDIS_HOST=redis
      - HF_HOME=/huggingface_cache
      - TRANSFORMERS_CACHE=/huggingface_cache
      - HF_DATASETS_CACHE=/huggingface_cache
    ports:
      - "5050:5050"
    networks:
      - memes-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  search:
    build:
      context: ./docker/python
      dockerfile: Dockerfile.search
    ports:
      - "5051:5051"
    volumes:
      - ./docker/python/.:/app
      - huggingface_cache:/huggingface_cache
    environment:
      - REDIS_HOST=redis
      - HF_HOME=/huggingface_cache
      - TRANSFORMERS_CACHE=/huggingface_cache
      - HF_DATASETS_CACHE=/huggingface_cache
    depends_on:
      - redis
    deploy:
      resources:
        limits:
            memory: 4G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  mysql_data:
  redis_data:
  vendor:
  storage:
  huggingface_cache:

networks:
  memes-network:
